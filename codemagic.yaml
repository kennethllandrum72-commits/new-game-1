workflows:
  trailride-ios-testflight:
    name: TrailRide iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TrailRide App Store Connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trailride.nearme
      vars:
        BUNDLE_ID: com.trailride.nearme
        XCODE_WORKSPACE: trailride-native/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: |
          cd trailride-native
          npm install
      - name: Prepare web bundle
        script: |
          cd trailride-native
          npm run prepare:web
      - name: Generate and sync iOS project
        script: |
          cd trailride-native
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          node scripts/configure-ios-background-location.mjs
          BUILD_NUM="${BUILD_NUMBER:-2}"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Using iOS build number ${BUILD_NUM}"
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles \
            --project "$XCODE_WORKSPACE" \
            --archive-method app-store \
            --custom-export-options='{"testFlightInternalTestingOnly": true}' \
            --code-signing-setup-verbose-logging
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
