workflows:
  trailride-ios-validate:
    name: TrailRide iOS Validate Only
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.trailride.nearme
        XCODE_PROJECT: trailride-native/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: |
          cd trailride-native
          npm install
      - name: Prepare web bundle
        script: |
          cd trailride-native
          npm run prepare:web
      - name: Generate and sync iOS project
        script: |
          cd trailride-native
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          node scripts/configure-ios-background-location.mjs
          node scripts/configure-native-corelocation.mjs
          node scripts/configure-healthkit.mjs
      - name: Verify native configuration
        script: |
          set -e
          cd trailride-native
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist
          grep -n "navigator.geolocation.getCurrentPosition" ../trailride/native-near-me.js
          grep -n "TrailRideHealthPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -n "registerPluginInstance(TrailRideHealthPlugin())" ios/App/App/TrailRideBridgeViewController.swift
          grep -n "com.apple.developer.healthkit" ios/App/App/App.entitlements
          grep -n "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" ios/App/App.xcodeproj/project.pbxproj
          echo "Location and Apple HealthKit configuration verified"
      - name: Compile iOS without upload
        script: |
          cd trailride-native
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  trailride-ios-testflight:
    name: TrailRide iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TrailRide App Store Connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trailride.nearme
      vars:
        BUNDLE_ID: com.trailride.nearme
        XCODE_WORKSPACE: trailride-native/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: |
          cd trailride-native
          npm install
      - name: Prepare web bundle
        script: |
          cd trailride-native
          npm run prepare:web
      - name: Generate and sync iOS project
        script: |
          set -e
          cd trailride-native
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          node scripts/configure-ios-background-location.mjs
          node scripts/configure-native-corelocation.mjs
          node scripts/configure-healthkit.mjs
          BUILD_NUM="${BUILD_NUMBER:-2}"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Verify release configuration
        script: |
          set -e
          cd trailride-native
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist
          grep -n "navigator.geolocation.getCurrentPosition" ../trailride/native-near-me.js
          grep -n "TrailRideHealthPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -n "com.apple.developer.healthkit" ios/App/App/App.entitlements
          echo "Release location and HealthKit paths verified"
      - name: Refresh Apple signing files
        script: |
          set -e
          keychain initialize
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "Fetched current App Store provisioning profile from Apple"
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "$XCODE_WORKSPACE" --archive-method app-store --custom-export-options='{"testFlightInternalTestingOnly": true}' --code-signing-setup-verbose-logging
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
      - name: Verify built IPA
        script: |
          set -e
          IPA_PATH=$(find "$CM_BUILD_DIR" -type f -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then IPA_PATH=$(find . -type f -name "*.ipa" -print -quit); fi
          [ -f "$IPA_PATH" ] || { echo "Built IPA not found"; exit 1; }
          VERIFY_DIR=$(mktemp -d); unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" "$APP_PATH/Info.plist"
          codesign -d --entitlements :- "$APP_PATH" 2>&1 | grep -q "com.apple.developer.healthkit"
          echo "Built IPA contains location and HealthKit configuration"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
