<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wildlands Survival 3D — Mobile Lite</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07120c;color:#fff;font:600 14px system-ui,sans-serif;touch-action:none}canvas{display:block}button{border:1px solid #c69b4b;border-radius:14px;background:#193224;color:#fff;padding:12px 16px;font-weight:800}.hud{position:fixed;z-index:5}.top{top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;pointer-events:none}.pill{background:#07120ccc;border:1px solid #6b875f;border-radius:12px;padding:7px 9px}.actions{right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;gap:8px}.actions button{width:112px}.message{top:72px;left:50%;transform:translateX(-50%);background:#07120ce8;padding:9px 15px;border-radius:12px;display:none}.joystick{position:fixed;width:110px;height:110px;border-radius:55px;background:#ffffff20;border:2px solid #ffffff66;z-index:4;display:none;pointer-events:none}.knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#e3b95cdd;left:30px;top:30px}.start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06130cdd,#0a1d13f2)}.card{width:min(90vw,430px);padding:28px;text-align:center;border:1px solid #b98d42;border-radius:24px;background:#0b2015}.card h1{font:800 38px Georgia,serif;color:#e3bd68;margin:0 0 4px}.card p{color:#c7d0c7;line-height:1.5}.card button{display:block;width:100%;margin-top:11px}.small{font-size:12px;color:#aab7aa}.help{left:12px;bottom:max(18px,env(safe-area-inset-bottom))}.help button{padding:10px}.panel{position:fixed;z-index:8;inset:12% 8% auto;background:#0b2015f5;border:1px solid #b98d42;border-radius:18px;padding:18px;display:none;max-height:70%;overflow:auto}.panel h2{color:#e3bd68}.panel button{margin:5px}.bar{height:7px;background:#422;border-radius:5px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#69b45f}.water{color:#78c8ff}.food{color:#ffd17b}
</style>
</head>
<body>
<div class="start" id="start"><div class="card"><h1>WILDLANDS</h1><b>MOBILE LITE — VERSION 73</b><p>A faster iPhone edition with a huge island, wildlife, gathering, and prefab building.</p><button id="play">PLAY</button><button id="new">NEW GAME</button><div class="small">Progress saves automatically on this device.</div></div></div>
<div class="hud top"><div class="pill">❤ <span id="hp">100</span></div><div class="pill food">FOOD <span id="food">85</span></div><div class="pill water">WATER <span id="water">85</span></div><div class="pill">WOOD <span id="wood">0</span></div><div class="pill">STONE <span id="stone">0</span></div></div>
<div class="hud message" id="msg"></div>
<div class="hud actions"><button id="act">GATHER</button><button id="build">PREFABS</button><button id="save">SAVE</button></div>
<div class="hud help"><button id="info">?</button></div>
<div class="joystick" id="joy"><div class="knob" id="knob"></div></div>
<div class="panel" id="panel"><h2>Prefab Building</h2><p>Place a ready-made structure near your survivor.</p><button data-build="shelter">Shelter — 10 wood</button><button data-build="cabin">Cabin — 25 wood, 10 stone</button><button id="close">CLOSE</button></div>
<script type="module">
import * as THREE from './three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc6df);scene.fog=new THREE.Fog(0x8bc6df,48,120);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff3ff,0x34552b,2.2));const sun=new THREE.DirectionalLight(0xffefc2,1.7);sun.position.set(25,50,15);scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const green=mat(0x4f7b3c),brown=mat(0x654228),rockmat=mat(0x6d716d),skin=mat(0xd2a06e),shirt=mat(0x2f608a);
const island=new THREE.Mesh(new THREE.CylinderGeometry(88,93,3,48),green);island.position.y=-1.5;scene.add(island);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.0,4,8),shirt);body.position.y=1.15;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),skin);head.position.y=2.15;player.add(head);scene.add(player);
const objects=[];function addObj(type,x,z){const g=new THREE.Group();if(type==='tree'){const t=new THREE.Mesh(new THREE.CylinderGeometry(.28,.42,3.4,6),brown);t.position.y=1.7;g.add(t);const c=new THREE.Mesh(new THREE.ConeGeometry(1.45,3.7,7),mat(0x285f31));c.position.y=4.2;g.add(c)}else{const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+Math.random()*.4,0),rockmat);r.position.y=.45;g.add(r)}g.position.set(x,0,z);g.userData={type,alive:true};scene.add(g);objects.push(g)}
for(let i=0;i<115;i++){const a=Math.random()*Math.PI*2,r=10+Math.random()*75;addObj(Math.random()<.68?'tree':'rock',Math.cos(a)*r,Math.sin(a)*r)}
const animals=[];function animal(kind,x,z,color){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.5,.85,.65),mat(color));b.position.y=.85;g.add(b);const h=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.52),mat(color));h.position.set(.9,1.15,0);g.add(h);for(const dz of [-.23,.23])for(const dx of [-.48,.48]){const l=new THREE.Mesh(new THREE.BoxGeometry(.16,.7,.16),mat(0x38291f));l.position.set(dx,.35,dz);g.add(l)}g.position.set(x,0,z);g.userData={kind,angle:Math.random()*6.28};scene.add(g);animals.push(g)}
animal('deer',18,12,0x9a7049);animal('deer',22,15,0x9a7049);animal('fox',-20,25,0xb85b2a);animal('stag',38,-20,0x765039);animal('horse',-36,-24,0x594438);animal('alpaca',10,-42,0xe5d3b0);animal('wolf',-48,8,0x6b7378);
function cabin(x,z,shelter=false){const g=new THREE.Group();const floor=new THREE.Mesh(new THREE.BoxGeometry(shelter?4:6,.25,shelter?3.5:5),brown);floor.position.y=.15;g.add(floor);for(const xx of shelter?[-1.7,1.7]:[-2.6,2.6])for(const zz of shelter?[-1.4,1.4]:[-2.1,2.1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.25,2.6,.25),brown);p.position.set(xx,1.45,zz);g.add(p)}const roof=new THREE.Mesh(new THREE.ConeGeometry(shelter?3.3:4.6,2,4),mat(0x70442c));roof.rotation.y=Math.PI/4;roof.scale.z=.75;roof.position.y=3.1;g.add(roof);if(!shelter){const wall=new THREE.Mesh(new THREE.BoxGeometry(5.5,2.4,.25),mat(0x9b6b3e));wall.position.set(0,1.35,-2.2);g.add(wall)}g.position.set(x,0,z);scene.add(g)}
cabin(4,7,true);cabin(-12,-8,false);
let state=JSON.parse(localStorage.getItem('wildlands_mobile_lite')||'null')||{x:0,z:3,hp:100,food:85,water:85,wood:0,stone:0};player.position.set(state.x,0,state.z);
const $=id=>document.getElementById(id);function hud(){for(const k of ['hp','food','water','wood','stone'])$(k).textContent=Math.round(state[k])}function save(){state.x=player.position.x;state.z=player.position.z;localStorage.setItem('wildlands_mobile_lite',JSON.stringify(state));say('Progress saved')}hud();
function say(t){$('msg').textContent=t;$('msg').style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>$('msg').style.display='none',1800)}
let move=new THREE.Vector2(),touchId=null,origin=new THREE.Vector2();function blocked(el){return el.closest('button,.panel,.start')}
addEventListener('pointerdown',e=>{if(blocked(e.target)||touchId!==null)return;touchId=e.pointerId;origin.set(e.clientX,e.clientY);$('joy').style.cssText+=`;display:block;left:${e.clientX-55}px;top:${e.clientY-55}px`});addEventListener('pointermove',e=>{if(e.pointerId!==touchId)return;const d=new THREE.Vector2(e.clientX-origin.x,e.clientY-origin.y),len=Math.min(42,d.length());if(d.length())d.normalize().multiplyScalar(len);move.set(d.x/42,d.y/42);$('knob').style.transform=`translate(${d.x}px,${d.y}px)`});function up(e){if(e.pointerId!==touchId)return;touchId=null;move.set(0,0);$('joy').style.display='none';$('knob').style.transform=''}addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('act').onclick=()=>{let best=null,dist=3.2;for(const o of objects)if(o.userData.alive){const d=o.position.distanceTo(player.position);if(d<dist){best=o;dist=d}}if(!best)return say('Move closer to a tree or rock');best.userData.alive=false;best.visible=false;if(best.userData.type==='tree'){state.wood+=3;say('+3 wood')}else{state.stone+=2;say('+2 stone')}hud();save()};
$('build').onclick=()=>$('panel').style.display='block';$('close').onclick=()=>$('panel').style.display='none';document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{const type=b.dataset.build,costW=type==='cabin'?25:10,costS=type==='cabin'?10:0;if(state.wood<costW||state.stone<costS)return say('Need more materials');state.wood-=costW;state.stone-=costS;const dir=new THREE.Vector3(0,0,-5).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);cabin(player.position.x+dir.x,player.position.z+dir.z,type==='shelter');$('panel').style.display='none';hud();save();say(type==='cabin'?'Cabin placed':'Shelter placed')});$('save').onclick=save;$('info').onclick=()=>say('Touch and drag anywhere to run. Gather near trees and rocks.');
$('play').onclick=()=>$('start').style.display='none';$('new').onclick=()=>{localStorage.removeItem('wildlands_mobile_lite');location.reload()};
let last=performance.now(),survival=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if($('start').style.display!=='none'){renderer.render(scene,camera);return}if(move.lengthSq()>.01){const v=new THREE.Vector3(move.x,0,move.y).normalize();player.position.addScaledVector(v,7*dt);const r=Math.hypot(player.position.x,player.position.z);if(r>84)player.position.multiplyScalar(84/r);player.rotation.y=Math.atan2(v.x,v.z)}for(const a of animals){a.userData.angle+=(Math.random()-.5)*dt;a.position.x+=Math.sin(a.userData.angle)*dt*.6;a.position.z+=Math.cos(a.userData.angle)*dt*.6}camera.position.lerp(new THREE.Vector3(player.position.x,12,player.position.z+10),.09);camera.lookAt(player.position.x,1,player.position.z);survival+=dt;if(survival>12){survival=0;state.food=Math.max(0,state.food-.5);state.water=Math.max(0,state.water-.7);hud();save()}renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('pagehide',save);
</script>
</body></html>
