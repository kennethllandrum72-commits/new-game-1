name: TrailRide iOS Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'trailride/**'
      - 'trailride-native/**'
      - '.github/workflows/trailride-ios.yml'

jobs:
  ios-build-check:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trailride-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare TrailRide web bundle
        run: npm run prepare:web

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor and native capabilities
        run: |
          npx cap sync ios
          npm run configure:ios

      - name: Verify App Store permissions and capabilities
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" ios/App/App/Info.plist
          ! /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" ios/App/App/Info.plist
          ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist
          grep -q "TrailRideLocationPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "TrailRideHealthPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "com.apple.developer.healthkit" ios/App/App/App.entitlements

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iPhone Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package generated iOS project
        run: zip -r TrailRide-iOS-Project.zip ios >/dev/null

      - name: Upload iOS project artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailRide-iOS-Project
          path: trailride-native/TrailRide-iOS-Project.zip
          retention-days: 14
